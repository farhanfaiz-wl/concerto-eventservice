plugins {
    id 'org.springframework.boot' version '2.4.4'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    //id 'com.github.sherter.google-java-format' version '0.9'
}

group 'ai.concerto'
version '0.0.1'

sourceCompatibility = 17

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'  
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.security:spring-security-messaging'

    implementation 'org.apache.commons:commons-lang3:3.11'
    implementation 'org.apache.commons:commons-pool2:2.9.0'
    implementation 'commons-codec:commons-codec:1.15'

    implementation 'com.google.guava:guava:12.0'
    implementation 'com.google.googlejavaformat:google-java-format:1.10.0'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.12.16'

    implementation 'org.modelmapper:modelmapper-examples:2.4.2'

    implementation 'com.amazon.alexa:ask-sdk-core:2.26.0'
    implementation 'com.slack.api:slack-api-client:1.15.0'
    
    implementation 'com.vonage:client:6.4.0'


    implementation "io.springfox:springfox-boot-starter:3.0.0"
    implementation "io.springfox:springfox-swagger-ui:3.0.0"

    implementation 'net.logstash.logback:logstash-logback-encoder:5.3'
    //Ealstic APM
    implementation 'co.elastic.apm:apm-agent-attach:1.34.1'
    
    implementation 'com.google.cloud:google-cloud-speech:2.5.2'
	implementation platform('com.google.cloud:libraries-bom:26.0.0')
    implementation 'com.google.cloud:google-cloud-texttospeech'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.11.0'
    implementation 'com.google.apis:google-api-services-businessmessages:1.25.4'
    
    //ogtags
    implementation 'org.hamcrest:hamcrest-core:2.2'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.25'
    implementation files('lib/opengraph.jar')
    
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'com.twilio.sdk:twilio:9.9.1'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.1'
    testImplementation 'org.mockito:mockito-core:4.3.1'
    testImplementation 'org.mockito:mockito-inline:4.3.1'

}

test{
    useJUnitPlatform()
    testLogging.showStandardStreams=true;
    testLogging {
        events "passed", "skipped"
    }
}

configurations {
    // exclude Tomcat
    compile.exclude module: 'spring-boot-starter-tomcat'
    all {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }
}

